<script>
const API=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[name](...args));
const State={token:localStorage.getItem('opsnora_token'),role:localStorage.getItem('opsnora_role'),data:null,question:null,selected:null,started:0};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const UI={
 toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)},
 loading(v=true){$('#loading').classList.toggle('hidden',!v);if(v)$('#screen').innerHTML=''},
 error(r){if(r&&r.error){if(/session|sign in/i.test(r.error)) Auth.signOut(); else UI.toast(r.error);return true}return false},
 title(kicker,title){$('#headerKicker').textContent=kicker;$('#pageTitle').textContent=title},
 closeModal(){$('#modal').classList.add('hidden')},
 badges(items){if(!items||!items.length)return;const b=items[0];$('#modalIcon').textContent=b.icon;$('#modalTitle').textContent=b.name;$('#modalText').textContent=b.description;$('#modal').classList.remove('hidden')}
};
const Auth={
 async login(e){e.preventDefault();$('#loginError').textContent='';const btn=e.target.querySelector('button');btn.disabled=true;try{const r=await API('login',$('#loginId').value,$('#loginPin').value);if(!r.ok)throw new Error(r.error);State.token=r.token;State.role=r.role;localStorage.setItem('opsnora_token',r.token);localStorage.setItem('opsnora_role',r.role);Auth.showApp(r.name);await Router.go(r.role==='ADMIN'?'admin':'dashboard')}catch(x){$('#loginError').textContent=x.message}finally{btn.disabled=false}},
 showApp(name){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#profileName').textContent=name||'Learner';$('#avatar').textContent=(name||'L')[0].toUpperCase();document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hidden',State.role!=='ADMIN'));document.querySelectorAll('nav button:not(.admin-only)').forEach(x=>x.classList.toggle('hidden',State.role==='ADMIN'&&x.dataset.view!=='dashboard'))},
 async signOut(){try{if(State.token)await API('logout',State.token)}catch(e){}localStorage.removeItem('opsnora_token');localStorage.removeItem('opsnora_role');State.token=null;location.reload()}
};
const Router={async go(view){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));UI.loading();try{if(view==='quiz')await Quiz.load();else if(view==='badges')await Student.badges();else if(view==='progress')await Student.progress();else if(view==='admin'||State.role==='ADMIN')await Admin.home();else await Student.home()}catch(e){UI.toast(e.message);UI.loading(false)}}};
const Student={
 async fetch(){const r=await API('getStudentDashboard',State.token);if(UI.error(r))return null;State.data=r.data;const d=r.data;$('#profileName').textContent=d.profile.name;$('#profileClass').textContent=d.profile.className;$('#avatar').textContent=d.profile.name[0];return d},
 async home(){UI.title('STUDENT DASHBOARD','Your learning space');const d=await Student.fetch();if(!d)return;const s=d.stats,n=d.nextQuestion;$('#screen').innerHTML=`<div class="hero"><section class="hero-main"><p class="eyebrow">WELCOME BACK</p><h1>Hey, ${esc(d.profile.name.split(' ')[0])}!<br><span class="gradient">Keep the momentum.</span></h1><p>${n?`Your next challenge is ready: ${esc(n.topic)} · ${esc(n.difficulty)}.`:'You completed every active question. Brilliant work!'}</p>${n?`<button class="primary continue" onclick="Router.go('quiz')">CONTINUE QUIZ &nbsp; →</button>`:''}</section><section class="card level-card"><div class="level-number"><small>CURRENT LEVEL</small>${d.profile.level}</div><div class="bar"><i style="width:${d.level.percent}%"></i></div><div class="barline"><span>${s.xp} XP</span><span>${d.level.nextAt?d.level.nextAt+' XP':'MAX LEVEL'}</span></div><p>${d.level.nextAt?`<b>${d.level.toNext} XP</b> to Level ${d.profile.level+1}`:'You reached the highest level.'}</p></section></div>
      <div class="stats">${Student.stat('⚡',s.xp,'Total XP')}${Student.stat('◇',s.completed+' / '+s.totalQuestions,'Questions')}${Student.stat('◎',s.accuracy+'%','Accuracy')}${Student.stat('🔥',s.streak+' days','Current streak')}</div>
      <div class="grid2"><section class="card"><div class="card-head"><h3>My badges</h3><button class="link-btn" onclick="Router.go('badges')">View all →</button></div><div class="badge-row">${Student.badgeHtml(d.badges.slice(0,5))}</div></section><section class="card"><div class="card-head"><h3>Recent activity</h3></div>${Student.activity(d.recent)}</section></div>
      <div class="grid2"><section class="card"><div class="card-head"><h3>Topic performance</h3><button class="link-btn" onclick="Router.go('progress')">Details →</button></div>${Student.topics(d.topics)}</section><section class="card"><div class="card-head"><h3>Today’s focus</h3></div><p style="color:var(--muted)">${n?'Complete the next question and protect your learning streak.':'Review your badges and celebrate your progress.'}</p><div class="bar green"><i style="width:${n?'55':'100'}%"></i></div></section></div>`;UI.loading(false)},
 stat(icon,value,label){return `<div class="card stat"><span class="icon">${icon}</span><strong>${value}</strong><small>${label}</small></div>`},
 badgeHtml(bs){return bs.map(b=>`<div class="badge ${b.earned?'':'locked'}"><div class="medal">${esc(b.icon||'✦')}</div><small>${esc(b.name)}</small></div>`).join('')||'<p class="muted">No badges available.</p>'},
 activity(xs){return `<div class="activity">${xs.map(x=>`<div class="activity-item"><span class="dot">+</span><p>${esc(x.title)}<small>${esc(x.type)} · ${fmtDate(x.date)}</small></p><b>+${x.xp} XP</b></div>`).join('')||'<p style="color:var(--muted)">Your activity will appear here.</p>'}</div>`},
 topics(xs){return xs.map(x=>`<div class="topic"><div><b>${esc(x.topic)}</b><span>${x.accuracy}%</span></div><div class="bar"><i style="width:${x.accuracy}%"></i></div></div>`).join('')||'<p style="color:var(--muted)">Complete a quiz to see topic insights.</p>'},
 async badges(){UI.title('ACHIEVEMENTS','Your badge collection');const d=await Student.fetch();if(!d)return;$('#screen').innerHTML=`<section class="card"><div class="card-head"><h3>${d.badges.filter(x=>x.earned).length} of ${d.badges.length} unlocked</h3></div><div class="badge-row">${Student.badgeHtml(d.badges)}</div></section>`;UI.loading(false)},
 async progress(){UI.title('PERFORMANCE','Progress & insights');const d=await Student.fetch();if(!d)return;const s=d.stats;$('#screen').innerHTML=`<div class="stats">${Student.stat('◎',s.accuracy+'%','Overall accuracy')}${Student.stat('◇',s.attempted,'Attempts')}${Student.stat('✓',s.correct,'Correct')}${Student.stat('×',s.wrong,'Incorrect')}</div><div class="grid2"><section class="card"><div class="card-head"><h3>Topic performance</h3></div>${Student.topics(d.topics)}</section><section class="card"><div class="card-head"><h3>Streak record</h3></div><div class="level-number"><small>LONGEST STREAK</small>${s.longestStreak} <span style="font-size:18px">days 🔥</span></div></section></div>`;UI.loading(false)}
};
const Quiz={
 async load(){UI.title('CONTINUE QUIZ','One question at a time');State.selected=null;State.started=Date.now();const r=await API('getNextQuestion',State.token);if(UI.error(r))return;State.question=r.question;Quiz.render()},
 render(){const q=State.question;if(!q){$('#screen').innerHTML='<div class="card empty"><div class="big">🏆</div><h2>You’re all caught up!</h2><p>There are no incomplete active questions.</p><button class="primary" onclick="Router.go(\'dashboard\')">BACK TO DASHBOARD</button></div>';UI.loading(false);return}$('#screen').innerHTML=`<div class="quiz-wrap"><div class="quiz-top"><span>QUESTION ${q.number} OF ${q.total}</span><span>${q.xp} XP AVAILABLE</span></div><div class="bar"><i style="width:${Math.round((q.number-1)/q.total*100)}%"></i></div><section class="card question-card"><div class="chips"><span class="chip">${esc(q.topic)}</span><span class="chip">${esc(q.difficulty)}</span></div><h1>${esc(q.text)}</h1><div class="options">${Object.entries(q.options).map(([k,v])=>`<button class="option" data-key="${k}" onclick="Quiz.select('${k}')"><b>${k}</b><span>${esc(v)}</span></button>`).join('')}</div><div id="feedback"></div><div class="quiz-actions"><button id="submitBtn" class="primary" onclick="Quiz.submit()" disabled>SUBMIT ANSWER</button></div></section></div>`;UI.loading(false)},
 select(k){if($('#feedback').innerHTML)return;State.selected=k;document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x.dataset.key===k));$('#submitBtn').disabled=false},
 async submit(){if(!State.selected)return;const btn=$('#submitBtn');btn.disabled=true;const r=await API('submitAnswer',State.token,State.question.id,State.selected,Math.round((Date.now()-State.started)/1000));if(UI.error(r)){btn.disabled=false;return}document.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(x.dataset.key===r.correctAnswer)x.classList.add('correct');if(x.dataset.key===State.selected&&!r.correct)x.classList.add('wrong')});$('#feedback').className='feedback'+(r.correct?'':' wrong');$('#feedback').innerHTML=`<h3>${r.correct?'Correct! '+(r.xpEarned?'+'+r.xpEarned+' XP':''):'Not quite.'}</h3><p>${esc(r.explanation)}</p>${!r.correct?`<small>Correct answer: ${esc(r.correctAnswer)}. ${esc(r.correctText||'')}</small>`:''}`;btn.textContent='NEXT QUESTION →';btn.disabled=false;btn.onclick=()=>Quiz.load();UI.badges(r.badges)}
};
const Admin={
 async home(){UI.title('ADMIN CONSOLE','Learning overview');const r=await API('getAdminDashboard',State.token);if(UI.error(r))return;const d=r.data;$('#profileClass').textContent='Administrator';$('#screen').innerHTML=`<div class="admin-cards">${Student.stat('◉',d.totals.students,'Total students')}${Student.stat('●',d.totals.activeStudents,'Active students')}${Student.stat('◇',d.totals.questions,'Active questions')}${Student.stat('↗',d.totals.attempts,'Total attempts')}</div><section class="card" style="margin-top:18px"><div class="card-head"><h3>Students</h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>STUDENT</th><th>XP</th><th>LEVEL</th><th>COMPLETED</th><th>ACCURACY</th><th>STREAK</th><th>LAST ACTIVE</th></tr></thead><tbody>${d.students.map(s=>`<tr data-id="${esc(s.id)}" onclick="Admin.detail('${esc(s.id)}')"><td><b>${esc(s.name)}</b><br><small>${esc(s.className)}</small></td><td>${s.xp}</td><td>${s.level}</td><td>${s.completed}/${s.total}</td><td>${s.accuracy}%</td><td>${s.streak} days</td><td>${fmtDate(s.lastActive)}</td></tr>`).join('')}</tbody></table></div></section><div class="forms">${Admin.xpForm(d.students)}${Admin.questionForm()}</div>`;UI.loading(false)},
 xpForm(ss){return `<section class="card"><div class="card-head"><h3>Award XP</h3></div><form id="xpForm" onsubmit="Admin.award(event)"><label>Student<select name="studentId">${ss.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label><div class="form-grid"><label>Activity<select name="type"><option>Offline Class Task</option><option>Assignment</option><option>Project</option><option>Bonus</option><option>Other</option></select></label><label>XP<input name="xp" type="number" min="1" max="10000" value="50" required></label><label class="full">Description<input name="description" required placeholder="What did the student achieve?"></label></div><button class="primary" type="submit" style="margin-top:18px">AWARD XP</button></form></section>`},
 questionForm(){return `<section class="card"><div class="card-head"><h3>Add question</h3></div><form id="questionForm" onsubmit="Admin.addQuestion(event)"><div class="form-grid"><label>Topic<input name="topic" required></label><label>Subtopic<input name="subTopic"></label><label>Difficulty<select name="difficulty"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label>XP<input name="xp" type="number" value="10" min="1" max="100"></label><label class="full">Question<textarea name="question" required></textarea></label>${['A','B','C','D'].map(x=>`<label>Option ${x}<input name="option${x}" required></label>`).join('')}<label>Correct answer<select name="correctAnswer"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label class="full">Explanation<textarea name="explanation" required></textarea></label></div><button class="primary" type="submit">ADD QUESTION</button></form></section>`},
 async award(e){e.preventDefault();const f=new FormData(e.target),r=await API('awardManualXp',State.token,f.get('studentId'),f.get('type'),f.get('description'),f.get('xp'));if(UI.error(r))return;UI.toast(`XP awarded. New total: ${r.xp}`);UI.badges(r.badges);e.target.reset()},
 async addQuestion(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const r=await API('addQuestion',State.token,f);if(UI.error(r))return;UI.toast(`Question ${r.id} added`);e.target.reset()},
 async detail(id){UI.loading();const r=await API('getStudentDetail',State.token,id);if(UI.error(r))return;const d=r.data,s=d.stats;UI.title('STUDENT DETAIL',d.profile.name);$('#screen').innerHTML=`<button class="link-btn" onclick="Admin.home()">← Back to all students</button><div class="stats">${Student.stat('⚡',s.xp,'Total XP')}${Student.stat('◇',s.completed,'Completed')}${Student.stat('◎',s.accuracy+'%','Accuracy')}${Student.stat('🔥',s.streak+' days','Streak')}</div><div class="grid2"><section class="card"><div class="card-head"><h3>Topic performance</h3></div>${Student.topics(d.topics)}</section><section class="card"><div class="card-head"><h3>Earned badges</h3></div><div class="badge-row">${Student.badgeHtml(d.badges.filter(x=>x.earned))}</div></section></div><section class="card" style="margin-top:18px"><div class="card-head"><h3>Recent attempts</h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>DATE</th><th>QUESTION</th><th>TOPIC</th><th>ANSWER</th><th>RESULT</th><th>XP</th></tr></thead><tbody>${d.attempts.map(a=>`<tr><td>${fmtDate(a.Timestamp)}</td><td>${esc(a.QuestionID)}</td><td>${esc(a.Topic)}</td><td>${esc(a.SelectedAnswer)}</td><td>${String(a.IsCorrect).toLowerCase()==='true'?'Correct':'Wrong'}</td><td>${a.XPEarned}</td></tr>`).join('')}</tbody></table></div></section>`;UI.loading(false)}
};
$('#loginForm').addEventListener('submit',Auth.login);$('#logoutBtn').addEventListener('click',Auth.signOut);document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>Router.go(b.dataset.view)));
(async()=>{if(State.token){Auth.showApp();await Router.go(State.role==='ADMIN'?'admin':'dashboard')}})();
</script>
